<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>sorajima</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --pink: #ff3fa4;
      --pink-dark: #ed1788;
      --purple: #c44cff;
      --black: #111111;
      --gray: #707078;
      --line: rgba(17, 17, 17, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      color: var(--black);
      background: #fff;
      overflow-x: hidden;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    /* =========================
       GRADIENTS
    ========================= */

    .gradient {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(25px);
      z-index: 0;
    }

    .gradient-1 {
      width: 700px;
      height: 700px;
      right: -250px;
      top: 30px;

      background:
        radial-gradient(
          circle,
          rgba(255, 63, 164, 0.28) 0%,
          rgba(255, 63, 164, 0.13) 35%,
          transparent 72%
        );
    }

    .gradient-2 {
      width: 550px;
      height: 550px;
      left: -300px;
      bottom: -100px;

      background:
        radial-gradient(
          circle,
          rgba(196, 76, 255, 0.18) 0%,
          rgba(255, 63, 164, 0.09) 40%,
          transparent 72%
        );
    }

    .gradient-3 {
      width: 400px;
      height: 400px;
      left: 38%;
      top: -250px;

      background:
        radial-gradient(
          circle,
          rgba(255, 128, 201, 0.16),
          transparent 70%
        );
    }

    /* =========================
       NAVIGATION
    ========================= */

    nav {
      position: relative;
      z-index: 10;

      width: min(1240px, calc(100% - 48px));
      height: 92px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: var(--black);
      text-decoration: none;

      font-family: "Unbounded", sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: var(--pink);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 34px;
    }

    .nav-links a {
      color: #3d3d42;
      text-decoration: none;

      font-size: 14px;
      font-weight: 500;

      transition: color 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--pink);
    }

    .nav-status {
      padding: 11px 18px;

      border-radius: 999px;

      color: white;
      background: var(--black);

      font-size: 13px;
      font-weight: 600;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      z-index: 2;

      width: min(1240px, calc(100% - 48px));
      min-height: calc(100vh - 92px);

      margin: 0 auto;

      display: grid;
      grid-template-columns: 1fr 0.95fr;

      align-items: center;
      gap: 70px;

      padding: 55px 0 100px;
    }

    .hero-content {
      position: relative;
      z-index: 4;
    }

    /* =========================
       EYEBROW
    ========================= */

    .eyebrow {
      width: fit-content;

      display: flex;
      align-items: center;
      gap: 9px;

      padding: 8px 13px;

      margin-bottom: 30px;

      border: 1px solid rgba(255, 63, 164, 0.2);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.75);

      backdrop-filter: blur(12px);

      color: var(--pink-dark);

      font-size: 12px;
      font-weight: 600;

      animation: fadeUp 0.8s ease both;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #ffb12b;

      box-shadow:
        0 0 0 5px rgba(255, 177, 43, 0.1),
        0 0 15px rgba(255, 177, 43, 0.55);
    }

    /* =========================
       TITLE
    ========================= */

    h1 {
      max-width: 780px;

      font-size: clamp(52px, 6.5vw, 94px);
      line-height: 0.98;

      font-weight: 800;
      letter-spacing: -5px;

      animation: fadeUp 0.8s 0.1s ease both;
    }

    .gradient-text {
      display: inline-block;

      background:
        linear-gradient(
          100deg,
          #ff248f 0%,
          #ff4eaf 35%,
          #c64cff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    /* =========================
       DESCRIPTION
    ========================= */

    .hero-description {
      max-width: 520px;

      margin-top: 30px;

      color: var(--gray);

      font-size: 17px;
      line-height: 1.65;

      animation: fadeUp 0.8s 0.2s ease both;
    }

    /* =========================
       DEVELOPMENT STATUS
    ========================= */

    .hero-actions {
      margin-top: 38px;

      animation: fadeUp 0.8s 0.3s ease both;
    }

    .development-status {
      width: fit-content;

      display: inline-flex;
      align-items: center;
      gap: 12px;

      min-height: 54px;
      padding: 0 24px;

      border-radius: 999px;

      color: white;

      background:
        linear-gradient(
          105deg,
          #ff248f,
          #ff42a6 45%,
          #c94cff
        );

      box-shadow:
        0 15px 40px rgba(255, 63, 164, 0.25);

      font-size: 14px;
      font-weight: 700;
    }

    .development-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #ffcf5c;

      box-shadow:
        0 0 12px rgba(255, 207, 92, 0.9);
    }

    /* =========================
       VISUAL
    ========================= */

    .visual-wrap {
      position: relative;

      min-height: 590px;

      display: flex;
      align-items: center;
      justify-content: center;

      animation: visualIn 1s 0.15s ease both;
    }

    /* =========================
       ORB
    ========================= */

    .orb {
      position: absolute;

      width: 490px;
      height: 490px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 34% 27%,
          #ffffff 0%,
          rgba(255, 255, 255, 0.95) 8%,
          rgba(255, 190, 225, 0.95) 23%,
          rgba(255, 63, 164, 0.84) 52%,
          rgba(211, 58, 232, 0.72) 76%,
          rgba(182, 58, 255, 0.18) 100%
        );

      box-shadow:
        0 0 80px rgba(255, 63, 164, 0.25),
        0 0 150px rgba(197, 62, 255, 0.12);

      animation: float 6s ease-in-out infinite;
    }

    .orb::before,
    .orb::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      border: 1px solid rgba(255, 63, 164, 0.14);

      transform: rotate(-20deg) scaleY(0.35);
    }

    .orb::before {
      inset: -45px;
    }

    .orb::after {
      inset: -90px;

      border-color: rgba(185, 76, 255, 0.1);

      transform: rotate(-20deg) scaleY(0.25);
    }

    /* =========================
       SPEED CARD
    ========================= */

    .speed-card {
      position: relative;
      z-index: 3;

      width: 390px;

      padding: 30px;

      border-radius: 32px;

      background: rgba(255, 255, 255, 0.76);

      border: 1px solid rgba(255, 255, 255, 0.95);

      box-shadow:
        0 30px 90px rgba(46, 19, 45, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);

      backdrop-filter: blur(25px);

      transform: rotate(2deg);

      transition:
        transform 0.4s ease,
        box-shadow 0.4s ease;
    }

    .speed-card:hover {
      transform: rotate(0deg) translateY(-7px);

      box-shadow:
        0 40px 100px rgba(46, 19, 45, 0.17);
    }

    .speed-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 45px;
    }

    .speed-label {
      color: #777;

      font-size: 11px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;

      color: #454545;

      font-size: 10px;
      font-weight: 600;
    }

    .connection-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #32d583;

      box-shadow:
        0 0 10px rgba(50, 213, 131, 0.7);
    }

    .speed-number {
      font-family: "Unbounded", sans-serif;

      font-size: 58px;
      line-height: 1;

      letter-spacing: -4px;
      font-weight: 700;

      background:
        linear-gradient(
          100deg,
          #ff248f,
          #c64cff
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .speed-unit {
      margin-top: 12px;

      color: #858585;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 1px;
    }

    /* =========================
       SIGNAL
    ========================= */

    .signal {
      position: relative;

      height: 100px;

      margin-top: 32px;

      overflow: hidden;

      border-radius: 20px;

      background:
        linear-gradient(
          180deg,
          rgba(255, 63, 164, 0.06),
          rgba(255, 63, 164, 0.01)
        );
    }

    .signal-grid {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255, 63, 164, 0.07) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 63, 164, 0.07) 1px,
          transparent 1px
        );

      background-size: 25px 25px;
    }

    .wave {
      position: absolute;

      left: -10%;
      top: 50%;

      width: 120%;
      height: 50px;

      transform: translateY(-50%);

      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 63, 164, 0.7),
          rgba(255, 63, 164, 0) 66%
        );

      filter: blur(9px);

      animation: waveMove 3s linear infinite;
    }

    .wave-line {
      position: absolute;

      left: -5%;
      top: 50%;

      width: 110%;
      height: 2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--pink),
          #c44cff,
          var(--pink),
          transparent
        );

      box-shadow:
        0 0 20px rgba(255, 63, 164, 0.8);

      animation: lineMove 2.5s ease-in-out infinite;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 1px;

      margin-top: 34px;

      overflow: hidden;

      border: 1px solid var(--line);
      border-radius: 20px;

      background: var(--line);
    }

    .stat {
      padding: 17px 14px;

      background: rgba(255, 255, 255, 0.65);
    }

    .stat-value {
      font-family: "Unbounded", sans-serif;

      font-size: 16px;
      font-weight: 700;

      letter-spacing: -1px;
    }

    .stat-label {
      margin-top: 6px;

      color: #999;

      font-size: 9px;
      font-weight: 600;

      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* =========================
       SCROLL
    ========================= */

    .scroll-note {
      position: absolute;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      z-index: 5;

      display: flex;
      align-items: center;
      gap: 10px;

      color: #aaa;

      font-size: 9px;
      font-weight: 600;

      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .scroll-line {
      width: 30px;
      height: 1px;

      background: #ddd;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes visualIn {
      from {
        opacity: 0;
        transform: translateX(35px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-16px) scale(1.015);
      }
    }

    @keyframes waveMove {
      0% {
        transform: translate(-20%, -50%) scaleX(0.8);
      }

      50% {
        transform: translate(5%, -50%) scaleX(1.1);
      }

      100% {
        transform: translate(20%, -50%) scaleX(0.8);
      }
    }

    @keyframes lineMove {
      0%,
      100% {
        transform: translateX(-5%) scaleX(0.9);
      }

      50% {
        transform: translateX(5%) scaleX(1);
      }
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 980px) {
      nav {
        width: min(100% - 32px, 700px);
      }

      .nav-links a {
        display: none;
      }

      .hero {
        width: min(100% - 32px, 700px);

        grid-template-columns: 1fr;

        gap: 30px;

        padding-top: 55px;
      }

      .hero-content {
        text-align: center;
      }

      .eyebrow {
        margin-left: auto;
        margin-right: auto;
      }

      h1 {
        margin-left: auto;
        margin-right: auto;

        letter-spacing: -3px;
      }

      .hero-description {
        margin-left: auto;
        margin-right: auto;
      }

      .hero-actions {
        display: flex;
        justify-content: center;
      }

      .visual-wrap {
        min-height: 520px;
      }

      .scroll-note {
        display: none;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 560px) {
      nav {
        width: calc(100% - 32px);
        height: 76px;
      }

      .logo {
        font-size: 17px;
      }

      .nav-status {
        padding: 10px 14px;
        font-size: 11px;
      }

      .hero {
        width: calc(100% - 32px);

        min-height: auto;

        padding-top: 45px;
        padding-bottom: 60px;
      }

      h1 {
        font-size: clamp(43px, 13vw, 66px);

        letter-spacing: -3px;
      }

      .hero-description {
        font-size: 15px;
        line-height: 1.55;
      }

      .development-status {
        width: 100%;

        justify-content: center;

        padding: 0 16px;

        font-size: 12px;
      }

      .visual-wrap {
        min-height: 450px;
      }

      .orb {
        width: 330px;
        height: 330px;
      }

      .speed-card {
        width: min(100%, 350px);

        padding: 23px;

        border-radius: 26px;
      }

      .speed-number {
        font-size: 43px;
        letter-spacing: -3px;
      }

      .speed-top {
        margin-bottom: 30px;
      }

      .stats {
        margin-top: 24px;
      }

      .stat {
        padding: 14px 9px;
      }

      .stat-value {
        font-size: 12px;
      }

      .stat-label {
        font-size: 7px;
      }

      .gradient-1 {
        width: 400px;
        height: 400px;

        right: -220px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- Розовые фоновые градиенты -->
    <div class="gradient gradient-1"></div>
    <div class="gradient gradient-2"></div>
    <div class="gradient gradient-3"></div>

    <!-- Навигация -->
    <nav>

      <a href="#" class="logo">
        SORAJIMA<span>.СС</span>
      </a>

    </nav>

    <!-- HERO -->
    <section class="hero">

      <div class="hero-content">

        <div class="eyebrow">
          <span class="status-dot"></span>
          Сервис находится в разработке
        </div>

        <h1>
          Интернет,<br>
          который
          <span class="gradient-text">летает.</span>
        </h1>

        <p class="hero-description">
          sorajima ускоряет ваше интернет-соединение,
          чтобы сайты открывались мгновенно, видео не тормозило,
          а игры работали без лишних задержек.
        </p>

      </div>

      <!-- SPEED VISUAL -->
      <div class="visual-wrap" id="speed">

        <div class="orb"></div>

        <div class="speed-card">

          <div class="speed-top">

            <span class="speed-label">
              Текущая скорость
            </span>

            <span class="connection">
              <span class="connection-dot"></span>
              Соединение активно
            </span>

          </div>

          <div class="speed-number">
            <span id="speedNumber">947</span>
          </div>

          <div class="speed-unit">
            MBPS DOWNLOAD
          </div>

          <div class="signal">

            <div class="signal-grid"></div>

            <div class="wave"></div>

            <div class="wave-line"></div>

          </div>

          <div class="stats">

            <div class="stat">
              <div class="stat-value">12 ms</div>
              <div class="stat-label">Ping</div>
            </div>

            <div class="stat">
              <div class="stat-value">947</div>
              <div class="stat-label">Mbps</div>
            </div>

            <div class="stat">
              <div class="stat-value">99.9%</div>
              <div class="stat-label">Uptime</div>
            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <script>
    /* =========================
       АНИМАЦИЯ СКОРОСТИ
    ========================= */

    const speedNumber = document.getElementById("speedNumber");

    let currentSpeed = 947;

    function updateSpeed() {

      const target = Math.floor(
        920 + Math.random() * 70
      );

      const start = currentSpeed;
      const difference = target - start;

      const duration = 900;
      const startTime = performance.now();

      function animate(time) {

        const progress = Math.min(
          (time - startTime) / duration,
          1
        );

        const eased =
          1 - Math.pow(1 - progress, 3);

        const value = Math.round(
          start + difference * eased
        );

        speedNumber.textContent = value;

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          currentSpeed = target;
        }
      }

      requestAnimationFrame(animate);
    }

    setInterval(updateSpeed, 2600);


    /* =========================
       3D ЭФФЕКТ КАРТОЧКИ
    ========================= */

    const card = document.querySelector(".speed-card");
    const visual = document.querySelector(".visual-wrap");

    visual.addEventListener("mousemove", (event) => {

      if (window.innerWidth < 980) return;

      const rect = visual.getBoundingClientRect();

      const x =
        (event.clientX - rect.left) / rect.width - 0.5;

      const y =
        (event.clientY - rect.top) / rect.height - 0.5;

      card.style.transform = `
        rotateY(${x * 5}deg)
        rotateX(${y * -5}deg)
        translateY(-5px)
      `;
    });

    visual.addEventListener("mouseleave", () => {
      card.style.transform = "rotate(2deg)";
    });
  </script>

</body>
</html>
